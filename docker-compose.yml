# SchoolEMS Multi-Tenant School Management Platform — Local Environment
#   docker compose up -d --build
#   Frontend UI: http://localhost:3000
#   Gateway API: http://localhost:8080/api/health
#   Auth Service: http://localhost:4001
name: schoolems

x-node-service: &node-service
  build:
    context: ./services
    dockerfile: Dockerfile
  restart: unless-stopped
  networks: [backend]
  depends_on:
    postgres:
      condition: service_healthy

x-db-env: &db-env
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:-postgres}
  PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
  JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:18-alpine
    container_name: schoolems-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  auth-service:
    <<: *node-service
    image: schoolems/auth-service:local
    container_name: schoolems-auth
    build: { context: ./services, args: { SERVICE: auth-service } }
    environment:
      <<: *db-env
      PORT: "4001"
      DB_NAME: auth_db
    ports:
      - "4001:4001"

  gateway:
    <<: *node-service
    image: schoolems/gateway:local
    container_name: schoolems-gateway
    build: { context: ./services, args: { SERVICE: gateway } }
    depends_on: [auth-service]
    environment:
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      AUTH_SERVICE_URL: http://auth-service:4001
    ports:
      - "8080:8080"
    networks: [backend, frontend]

  frontend:
    build: ./frontend
    image: schoolems/frontend:local
    container_name: schoolems-frontend
    environment:
      GATEWAY_URL: http://gateway:8080
    depends_on: [gateway]
    ports:
      - "3000:80"
    networks: [frontend]
    restart: unless-stopped

volumes:
  pgdata:

networks:
  backend:
  frontend:
