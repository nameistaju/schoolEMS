# order-service — Checkout saga + order history
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: telugu-pickles
  labels:
    app: order-service
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: telugu-pickles
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: telugu-pickles
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-service
          image: telugu-pickles/order-service   # real ECR URI + tag is set in kustomization.yml (images:)
          ports:
            - name: http
              containerPort: 4004
          envFrom:
            - configMapRef:
                name: telugu-pickles-config
            - secretRef:
                name: telugu-pickles-secrets
          env:
            - name: PORT
              value: "4004"
            - name: DB_NAME
              value: orders_db
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: telugu-pickles
  labels:
    app: order-service
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: telugu-pickles
    metrics: enabled
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 4004
      targetPort: http
