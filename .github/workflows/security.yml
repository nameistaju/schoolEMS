# Security scan — replaces SonarQube for this project.
#   Gitleaks : secrets (keys, tokens, passwords) anywhere in the git history  -> FAILS the run
#   Trivy fs : known CRITICAL vulnerabilities with a fix in npm dependencies  -> FAILS the run
#   Trivy    : Kubernetes / Terraform / Dockerfile misconfigurations           -> report only
# Findings also appear under the repo's  Security -> Code scanning  tab (SARIF).
#
# Runs on its own (PRs, pushes to main, weekly) and is called by the App CI and
# Infrastructure workflows as their first gate. Needs NO secrets.
name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "gitops/kustomization.yml" # image-tag bumps by the CI bot
  schedule:
    - cron: "30 3 * * 1" # Mondays 03:30 UTC: new CVEs appear even when code doesn't change
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write # upload SARIF to Code scanning

env:
  GITLEAKS_VERSION: "8.30.1"
  # Pinned by digest: a re-pushed tag cannot change what runs here
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  # Mirror on ECR Public avoids GHCR rate limits ("TOOMANYREQUESTS") on shared runners
  TRIVY_DB: public.ecr.aws/aquasecurity/trivy-db:2

jobs:
  gitleaks:
    name: Gitleaks — secrets in git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret deleted later is still leaked

      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $file\$" | sha256sum -c -
          tar -xzf "$file" gitleaks && sudo mv gitleaks /usr/local/bin/

      - name: Scan
        run: |
          gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --report-format sarif --report-path gitleaks.sarif --exit-code 1

      - name: Upload to Code scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true # Code scanning may be off for private repos without GHAS
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  trivy:
    name: Trivy — dependencies, secrets, IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vulnerable dependencies + secrets (fail on fixable CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs . \
            --db-repository "$TRIVY_DB" --scanners vuln,secret \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress

      - name: IaC misconfigurations (report only)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config . \
            --severity HIGH,CRITICAL --exit-code 0 \
            --skip-dirs projects/Infrastructure/.terraform
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config . \
            --severity HIGH,CRITICAL --exit-code 0 --quiet \
            --skip-dirs projects/Infrastructure/.terraform \
            --format sarif --output trivy-config.sarif

      - name: Upload to Code scanning
        if: always() && hashFiles('trivy-config.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
