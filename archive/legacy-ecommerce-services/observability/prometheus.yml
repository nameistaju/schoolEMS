# Local Prometheus (docker compose). On EKS the kube-prometheus-stack
# discovers the same /metrics endpoints through a ServiceMonitor instead.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: telugu-pickles
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
          - auth-service:4001
          - catalog-service:4002
          - cart-service:4003
          - order-service:4004
          - payment-service:4005
