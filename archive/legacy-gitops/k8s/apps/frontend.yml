# frontend — React SPA served by nginx; nginx proxies /api to the gateway.
#
# BLUE-GREEN release (Argo Rollouts):
#   active  (blue)  = Service "frontend"          -> ALB port 80   (what shoppers see)
#   preview (green) = Service "frontend-preview"  -> ALB port 8080 (the new version, for testing)
# A new image starts the green pods next to the blue ones. They wait, fully running, until
# someone PROMOTES (GitHub Actions -> "Release control", or kubectl argo rollouts promote frontend).
# Promotion flips the "frontend" Service to green in one step; blue stays 2 more minutes for instant rollback.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend
  namespace: telugu-pickles
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: telugu-pickles
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: frontend
  strategy:
    blueGreen:
      activeService: frontend
      previewService: frontend-preview
      autoPromotionEnabled: false   # a human (or the pipeline) decides when green goes live
      scaleDownDelaySeconds: 120    # keep blue running 2 min after the switch: instant rollback
      prePromotionAnalysis:         # green must reach the whole backend (gateway health) before it can go live
        templates:
          - templateName: http-health
        args:
          - name: url
            value: http://frontend-preview.telugu-pickles.svc/api/health
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: telugu-pickles
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: telugu-pickles/frontend
          ports:
            - name: http
              containerPort: 80
          env:
            - name: GATEWAY_URL
              value: http://gateway:8080
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
---
# Active (blue) Service. Argo Rollouts adds a rollouts-pod-template-hash selector to it.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: telugu-pickles
  labels:
    app: frontend
    app.kubernetes.io/part-of: telugu-pickles
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Preview (green) Service: points at the NEW version while a release is waiting.
apiVersion: v1
kind: Service
metadata:
  name: frontend-preview
  namespace: telugu-pickles
  labels:
    app: frontend
    app.kubernetes.io/part-of: telugu-pickles
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Public entry point: the AWS Load Balancer Controller turns this into an
# internet-facing Application Load Balancer in the public subnets.
# No host rule -> works on the ALB's own hostname. When a domain is configured,
# Terraform's Argo CD Application patches in shop.<domain> + HTTPS (ACM).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: telugu-pickles
  labels:
    app: frontend
    app.kubernetes.io/part-of: telugu-pickles
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: telugu-pickles
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
# Same ALB, port 8080 -> the green (preview) version. Test it here before promoting.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-preview
  namespace: telugu-pickles
  labels:
    app: frontend
    app.kubernetes.io/part-of: telugu-pickles
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: telugu-pickles
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":8080}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-preview
                port:
                  name: http
